name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Syntax check
        run: |
          for f in server.js routes/*.js lib/*.js config/*.js public/js/*.js; do node --check "$f"; done
      - run: bash -n scripts/deploy.sh

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # The key is restricted server-side (command=/usr/local/bin/rb-deploy);
          # the remote command only selects the branch.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy ${GITHUB_REF_NAME}"
      - name: Smoke test
        run: |
          sleep 5
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" -L https://rb.kv.thebetawebsite.com/
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
